version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        # Fix for npm optional dependencies bug with Rollup
        - rm -rf node_modules package-lock.json
        - npm cache clean --force
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*